services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/pocketmind.db
    volumes:
      - pocketmind_data:/app/data
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/pocketmind.db
    volumes:
      - pocketmind_data:/app/data
    command: python -m app.bot.main
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/pocketmind.db
    volumes:
      - pocketmind_data:/app/data
    command: python -m app.scheduler.worker
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./infra/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  tunnel:
    image: boro/localtunnel-client:latest
    depends_on:
      proxy:
        condition: service_started
    command: --port 80 --local-host proxy
    restart: unless-stopped

volumes:
  pocketmind_data:
