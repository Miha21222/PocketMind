# PocketMind backend — single-container deployment for a VPS (e.g. Hostinger)
# behind a Cloudflare Tunnel. This is the only compose file; the frontend is a
# separate entity built and served by GitHub Pages.
#
# One image runs the whole backend (API + Telegram bot + reminder scheduler)
# under supervisord; the entrypoint applies DB migrations on start. cloudflared
# publishes it at your stable https://api.<your-domain> with TLS terminated at
# Cloudflare's edge — no host ports are exposed, the tunnel is the only ingress.
#
#   docker compose up -d --build     # build + start
#   docker compose logs -f           # watch API + bot + scheduler + tunnel
#   docker compose down              # stop (SQLite data persists in the volume)
#
# Requires one repo-root .env file. Docker Compose reads it for substitution,
# the backend imports it via env_file, and the frontend Vite config now reads
# the same root file too. In Cloudflare Zero Trust the tunnel hostname
# (api.<your-domain>) Service must point at http://backend:8000.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: pocketmind-backend:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/pocketmind.db
    # Reachable only inside the compose network (by cloudflared), never on the
    # public host. The image's HEALTHCHECK drives the service_healthy gate below.
    expose:
      - "8000"
    volumes:
      - pocketmind_data:/app/data
    restart: unless-stopped

  # Cloudflare Tunnel connector. Set TUNNEL_TOKEN in .env (the long "eyJ..."
  # connector token from the Zero Trust dashboard, NOT the tunnel UUID).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pocketmind_data:
