[project]
name = "pocketmind-backend"
version = "1.1.0"
description = "PocketMind FastAPI backend, bot and scheduler"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.8.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.13.2",
  "asyncpg>=0.30.0",
  "apscheduler>=3.10.4",
  "faster-whisper>=1.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "python-jose[cryptography]>=3.3.0",
  "psycopg[binary]>=3.2.9",
  "sqlalchemy>=2.0.35",
  "uvicorn[standard]>=0.30.6"
]

[tool.uv]
package = false
