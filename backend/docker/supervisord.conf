; All-in-one process supervision for the self-contained PocketMind backend image.
; Runs the API, the Telegram bot poller, and the reminder scheduler side by side,
; streaming every child's output to the container stdout/stderr so `docker logs`
; shows everything. Children inherit the container environment (BOT_TOKEN, etc.).

[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid
; Discard supervisord's own file log; in nodaemon mode it still prints to the
; console once (avoids the duplicate lines caused by also logging to /dev/stdout).
logfile=/dev/null
logfile_maxbytes=0

; Local control socket so `supervisorctl status` works inside the container.
[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[group:app]
programs=api,bot,scheduler

[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app/backend
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bot]
; Requires BOT_TOKEN. Without it the process exits and supervisor stops retrying
; after `startretries`; the API keeps running regardless.
command=python -m app.bot.main
directory=/app/backend
autostart=true
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
; Also requires BOT_TOKEN to send reminders; same failure behavior as the bot.
command=python -m app.scheduler.worker
directory=/app/backend
autostart=true
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
