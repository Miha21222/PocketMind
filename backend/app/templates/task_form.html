{% extends 'base.html' %}{% block content %}<form class="task-form" method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Title<input name="title" value="{{ values.title if values else task.title if task else '' }}" required>{% if errors.title %}<span class="error">{{ errors.title }}</span>{% endif %}</label><label>Description<textarea class="description-textarea" name="description">{{ values.description if values else task.description if task and task.description else '' }}</textarea></label><label>Type<select name="type">{% for option in ['quick','deadline','no_deadline','recurring','waiting'] %}<option value="{{ option }}" {% if (values.type if values else task.type.value if task else 'quick') == option %}selected{% endif %}>{{ option }}</option>{% endfor %}</select></label><label>Deadline<input type="date" name="deadline_at" value="{{ task.deadline_at.strftime('%Y-%m-%d') if task and task.deadline_at else '' }}">{% if errors.deadline_at %}<span class="error">{{ errors.deadline_at }}</span>{% endif %}</label><label>Recurrence<select name="recurrence_rule"><option value="">None</option><option value="RRULE:FREQ=DAILY">Daily</option><option value="RRULE:FREQ=WEEKLY;BYDAY=MO">Weekly Monday</option><option value="RRULE:FREQ=MONTHLY">Monthly</option></select></label><label>Reminder mode<select name="reminder_mode">{% for option in ['none','once_at_time','daily_at_time','every_n_hours'] %}<option value="{{ option }}" {% if task and task.reminder_mode.value == option %}selected{% endif %}>{{ option }}</option>{% endfor %}</select></label><label>Reminder time<input type="time" name="reminder_time_local" value="{{ task.reminder_time_local if task else preferences.deadline_reminder_time_local }}"></label><label>Reminder interval<input type="number" name="reminder_interval_hours" min="1" max="24" value="{{ task.reminder_interval_hours if task and task.reminder_interval_hours else 4 }}"></label><button type="submit">Save</button></form>{% endblock %}
